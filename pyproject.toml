[project]
name = "strand-integration"
version = "0.1.0"
description = "Refinement of hair geometry by strand integration"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "open3d",
    "torch==2.2.2+cu118 ; platform_system == \"Linux\" or platform_system == \"Windows\"",
    "tqdm",
    "matplotlib",
    "OpenEXR",
    "Imath",
    "strandtools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
strandtools = { path = "cpp_ext" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
