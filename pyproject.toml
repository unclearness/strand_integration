[project]
name = "strand-integration"
version = "0.1.0"
description = "Refinement of hair geometry by strand integration"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "open3d",
    "torch",
    "tqdm",
    "matplotlib",
    "OpenEXR",
    "Imath",
    "strandtools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
strandtools = { path = "cpp_ext" }
